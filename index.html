<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AutoDraw — Online Drawing Pad</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
<style>
:root{
  --bg:#f0f4f8; --surface:#fff; --border:#dadce0; --text:#202124;
  --muted:#5f6368; --accent:#4285f4; --accent-h:#3367d6;
  --hover:#f1f3f4; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
/* Toolbar */
.toolbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);z-index:10;
}
.logo{font-size:20px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px;white-space:nowrap}
.tg{display:flex;align-items:center;gap:3px;padding:0 6px;border-right:1px solid var(--border);height:40px}
.tg:last-child{border-right:none}
.tb{
  width:38px;height:38px;border:none;background:transparent;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text);transition:.15s;
}
.tb:hover{background:var(--hover)}
.tb.active{background:var(--accent);color:#fff}
.tb:disabled{opacity:.35;cursor:default}
/* Colors */
.pal{display:flex;gap:3px;flex-wrap:wrap;max-width:180px}
.sw{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.sw:hover{transform:scale(1.18)}
.sw.active{border-color:var(--text);transform:scale(1.12)}
.cpw{position:relative;width:26px;height:26px}
.cpw input{position:absolute;width:100%;height:100%;opacity:0;cursor:pointer}
.cpd{width:26px;height:26px;border-radius:5px;border:2px solid var(--border);background:var(--accent);pointer-events:none}
/* Size */
.sz{display:flex;align-items:center;gap:6px}
.sz label{font-size:12px;color:var(--muted)}
.sz input[type=range]{width:70px;cursor:pointer;accent-color:var(--accent)}
.szd{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.sdot{background:var(--text);border-radius:50%}
/* Main */
.main{flex:1;display:flex;overflow:hidden}
.cwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
#canvas{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);cursor:crosshair;touch-action:none;max-width:100%;max-height:100%}
/* Suggestion panel */
.sp{width:250px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sp-tabs{display:flex;border-bottom:1px solid var(--border)}
.sp-tab{
  flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;transition:.15s;background:none;border:none;border-right:1px solid var(--border);
}
.sp-tab:last-child{border-right:none}
.sp-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sp-tab:disabled{opacity:.4;cursor:default}
.sp-body{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sp-status{padding:20px 16px;text-align:center;font-size:13px;color:var(--muted);flex:1;display:flex;align-items:center;justify-content:center}
.ai-card{
  display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:.15s;
}
.ai-card:hover{background:var(--hover)}
.ai-emoji{font-size:28px;flex-shrink:0;width:40px;text-align:center}
.ai-info{flex:1;min-width:0}
.ai-label{font-size:13px;font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-conf{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.ai-conf-bar{height:100%;background:var(--accent);border-radius:2px}
.sp-footer{padding:8px 14px;font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--border)}
/* Clipart */
.cats{display:flex;gap:3px;padding:8px 10px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.cat{padding:3px 9px;border:1px solid var(--border);background:transparent;border-radius:16px;font-size:11px;cursor:pointer;color:var(--muted);transition:.15s}
.cat:hover{border-color:var(--accent);color:var(--accent)}
.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ci{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:8px;cursor:pointer;
  background:#f8f9fa;border:1px solid transparent;transition:.15s;
}
.ci:hover{background:var(--hover);border-color:var(--accent);transform:scale(1.06)}
.ci.selected{background:#e8f0fe;border-color:var(--accent)}
/* Toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--text);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Spinner */
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 0.7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:768px){
  .sp{width:170px}
  .tb{width:34px;height:34px;font-size:15px}
  .pal{max-width:110px}
  .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo">✏️ AutoDraw</div>
  <div class="tg">
    <button class="tb active" data-tool="brush" title="Brush (B)">🖌️</button>
    <button class="tb" data-tool="eraser" title="Eraser (E)">🧽</button>
    <button class="tb" data-tool="line" title="Line (L)">📏</button>
    <button class="tb" data-tool="rect" title="Rectangle (R)">⬜</button>
    <button class="tb" data-tool="circle" title="Circle (C)">⭕</button>
    <button class="tb" data-tool="fill" title="Fill (F)">🪣</button>
    <button class="tb" data-tool="stamp" title="Stamp (S)">📎</button>
  </div>
  <div class="tg">
    <div class="pal" id="palette"></div>
    <div class="cpw"><input type="color" id="customColor" value="#4285f4"><div class="cpd" id="colorDisplay"></div></div>
  </div>
  <div class="tg">
    <div class="sz"><label>Size</label><input type="range" id="sizeSlider" min="1" max="50" value="4"><div class="szd"><div class="sdot" id="sizeDot"></div></div></div>
  </div>
  <div class="tg">
    <button class="tb" id="undoBtn" title="Undo (Ctrl+Z)">↩️</button>
    <button class="tb" id="redoBtn" title="Redo (Ctrl+Y)">↪️</button>
    <button class="tb" id="clearBtn" title="Clear">🗑️</button>
    <button class="tb" id="downloadBtn" title="Download PNG">💾</button>
  </div>
</div>

<div class="main">
  <div class="cwrap"><canvas id="canvas"></canvas></div>
  <div class="sp">
    <div class="sp-tabs">
      <button class="sp-tab active" id="aiTab">🤖 AI</button>

    </div>
    <div class="sp-body" id="spBody"></div>
    <div class="sp-footer" id="spFooter">Draw something — AI guesses it!</div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ============ CLIPART LIBRARY ============
const clip={
'Faces':['😀','😎','😍','🤔','😢','😡','😴','🤗','😆','🥳','😱','🤯','😇','🤓','😏','😈','🥺','🙄','😋','🤩'],

'Travel':['🚗','🚕','🚌','🚑','🚒','🚜','🚲','🛵','🏍️','✈️','🚀','🛸','🚁','⛵','🚤','🚢','🏠','🏡','🏰','🗽','🗼','🎡','🎢','⛺','🏝️','🏔️','🗻','🗺️','🚂','🚆'],
'Objects':['⌚','📱','💻','⌨️','🖥️','📷','📸','📺','📻','💡','🔦','🕯️','🔋','🔌','💾','📞','🎮','🕹️','🎲','🧩','🎯','🎨','🎸','🎹','🥁','🎺','🎻','🎤','🎧','📖'],
'Symbols':['❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💕','💖','💘','💝','✅','❌','⚠️','💯','🔔','🎵','🎶','💬','💭','👍','👎','👏','🙌','🤝','✌️','🤞','🤟'],
};
let activeCat='Faces';

// ============ COLOR PALETTE ============
const colors=['#000000','#5f6368','#9aa0a6','#dadce0','#ea4335','#fbbc04','#34a853','#4285f4','#ff6d00','#7c4dff','#e91e63','#00bcd4','#8d6e63','#558b2f','#1565c0','#c2185b'];

// ============ CANVAS SETUP ============
function resizeCanvas(){
  const r=cwrap.getBoundingClientRect();
  const w=Math.max(200,Math.min(r.width-32,1200));
  const h=Math.max(200,Math.min(r.height-32,800));
  const img=canvas.width>0?ctx.getImageData(0,0,canvas.width,canvas.height):null;
  canvas.width=w;canvas.height=h;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  if(img){try{ctx.putImageData(img,0,0)}catch(e){}}
  ctx.lineCap='round';ctx.lineJoin='round';
}
window.addEventListener('resize',resizeCanvas);

// ============ UI BUILD ============
function buildPalette(){
  const p=document.getElementById('palette');
  p.innerHTML=colors.map((c,i)=>`<div class="sw${i===0?' active':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  p.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{setColor(s.dataset.c);p.querySelectorAll('.sw').forEach(x=>x.classList.remove('active'));s.classList.add('active')});
}
function setColor(c){
  color=c;document.getElementById('colorDisplay').style.background=c;
  document.getElementById('customColor').value=c;
}
document.getElementById('customColor').oninput=e=>{setColor(e.target.value);document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active'))};
document.getElementById('sizeSlider').oninput=e=>{
  size=+e.target.value;
  const d=document.getElementById('sizeDot');
  const sz=Math.min(size,24);d.style.width=sz+'px';d.style.height=sz+'px';
};
document.querySelectorAll('.tb[data-tool]').forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));
function selectTool(t){
  tool=t;
  document.querySelectorAll('.tb[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  canvas.style.cursor=(t==='fill'||t==='stamp')?'pointer':'crosshair';
}

// ============ DRAWING ============
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=canvas.width/r.width,sy=canvas.height/r.height;
  return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();canvas.setPointerCapture(e.pointerId);
  const p=getPos(e);drawing=true;sx=p.x;sy=p.y;lx=p.x;ly=p.y;
  clearTimeout(classifyTimer);
  if(tool==='brush'||tool==='eraser'){
    ctx.strokeStyle=tool==='eraser'?'#fff':color;
    ctx.lineWidth=size;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.1,p.y+0.1);ctx.stroke();
  }else if(tool==='fill'){
    floodFill(Math.floor(p.x),Math.floor(p.y),color);
    drawing=false;saveState();
  }else if(tool==='stamp'){
    if(selectedStamp){stampAt(selectedStamp,p.x,p.y,40+size*3)}
    drawing=false;saveState();
  }else{
    snap=ctx.getImageData(0,0,canvas.width,canvas.height);
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!drawing)return;e.preventDefault();
  const p=getPos(e);
  if(tool==='brush'||tool==='eraser'){
    ctx.strokeStyle=tool==='eraser'?'#fff':color;
    ctx.lineWidth=size;
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();
    lx=p.x;ly=p.y;
  }else if(tool==='line'){
    ctx.putImageData(snap,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=size;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(p.x,p.y);ctx.stroke();
  }else if(tool==='rect'){
    ctx.putImageData(snap,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=size;
    ctx.strokeRect(sx,sy,p.x-sx,p.y-sy);
  }else if(tool==='circle'){
    ctx.putImageData(snap,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=size;
    const cx=(sx+p.x)/2,cy=(sy+p.y)/2,rx=Math.abs(p.x-sx)/2,ry=Math.abs(p.y-sy)/2;
    ctx.beginPath();ctx.ellipse(cx,cy,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);ctx.stroke();
  }
});
canvas.addEventListener('pointerup',e=>{
  if(!drawing)return;drawing=false;
  if(tool==='brush'||tool==='eraser'||tool==='line'||tool==='rect'||tool==='circle'){
    saveState();
    if(tool==='brush')scheduleClassify();
  }
});
canvas.addEventListener('pointerleave',e=>{if(drawing&&tool!=='brush'&&tool!=='eraser'){ctx.putImageData(snap,0,0);drawing=false}});

// ============ FLOOD FILL ============
function floodFill(x,y,fc){
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=img.data,w=canvas.width,h=canvas.height;
  const si=(y*w+x)*4,sr=d[si],sg=d[si+1],sb=d[si+2];
  const fill=hexRgb(fc);
  if(sr===fill.r&&sg===fill.g&&sb===fill.b)return;
  const vis=new Uint8Array(w*h),tol=40;
  const st=[x,y];
  while(st.length>=2){
    const cy=st.pop(),cx=st.pop();
    if(cx<0||cx>=w||cy<0||cy>=h)continue;
    const pi=cy*w+cx;if(vis[pi])continue;
    const idx=pi*4;
    if(Math.abs(d[idx]-sr)>tol||Math.abs(d[idx+1]-sg)>tol||Math.abs(d[idx+2]-sb)>tol)continue;
    vis[pi]=1;d[idx]=fill.r;d[idx+1]=fill.g;d[idx+2]=fill.b;d[idx+3]=255;
    st.push(cx+1,cy,cx-1,cy,cx,cy+1,cx,cy-1);
  }
  ctx.putImageData(img,0,0);
}

// ============ STAMP ============
function stampAt(emoji,x,y,sz){
  ctx.save();
  ctx.font=sz+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(emoji,x,y);
  ctx.restore();
}
function getDrawBounds(){
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=img.data,w=canvas.width,h=canvas.height;
  let minX=w,minY=h,maxX=0,maxY=0,found=false;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){
    const i=(y*w+x)*4;
    if(d[i]<245||d[i+1]<245||d[i+2]<245){
      found=true;
      if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
    }
  }
  return found?{x:minX,y:minY,w:maxX-minX,h:maxY-minY}:null;
}
function applyAISuggestion(emoji){
  const b=getDrawBounds();
  if(b){
    ctx.fillStyle='#fff';ctx.fillRect(b.x-10,b.y-10,b.w+20,b.h+20);
    const cx=b.x+b.w/2,cy=b.y+b.h/2;
    const sz=Math.max(b.w,b.h)*1.3+10;
    stampAt(emoji,cx,cy,sz);
  }else{
    stampAt(emoji,canvas.width/2,canvas.height/2,60);
  }
  saveState();
  aiState='ready';lastResults=[];renderSP();
  selectTool('brush');
  showToast('Stamped! ✅');
}

// ============ UNDO/REDO ============
function saveState(){
  try{
    undoS.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    if(undoS.length>maxU)undoS.shift();
    redoS=[];
  }catch(e){}
}
document.getElementById('undoBtn').onclick=()=>{
  if(undoS.length<=1)return;
  redoS.push(undoS.pop());
  ctx.putImageData(undoS[undoS.length-1],0,0);
  if(activeTab==='ai'){lastResults=[];aiState=classifier?'ready':'unavailable';renderSP()}
};
document.getElementById('redoBtn').onclick=()=>{
  if(!redoS.length)return;
  const s=redoS.pop();undoS.push(s);ctx.putImageData(s,0,0);
};
document.getElementById('clearBtn').onclick=()=>{
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  saveState();lastResults=[];aiState=classifier?'ready':'unavailable';renderSP();
};
document.getElementById('downloadBtn').onclick=()=>{
  const a=document.createElement('a');
  a.download='autodraw-'+Date.now()+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();showToast('Downloaded! 💾');
};

// ============ AI (ml5 DoodleNet) ============
let classifyTimer=null;
function scheduleClassify(){
  clearTimeout(classifyTimer);
  classifyTimer=setTimeout(()=>classifyDrawing(),700);
}
function tryInitAI(){
  if(typeof ml5==='undefined'){aiState='unavailable';renderSP();return}
  aiState='loading';renderSP();
  try{
    classifier=ml5.imageClassifier('DoodleNet',()=>{
      aiState='ready';renderSP();
    });
  }catch(e){aiState='unavailable';renderSP()}
  setTimeout(()=>{if(aiState==='loading'){aiState='unavailable';renderSP()}},20000);
}
function classifyDrawing(){
  if(aiState!=='ready'||!classifier)return;
  if(activeTab!=='ai')return;
  aiState='analyzing';renderSP();
  try{
    classifier.classify(canvas,(err,res)=>{
      if(err||!res){aiState='ready';renderSP();return}
      lastResults=(res||[]).slice(0,6);
      aiState='results';renderSP();
    });
  }catch(e){aiState='ready';renderSP()}
}

// ============ SUGGESTION PANEL ============
document.getElementById('aiTab').onclick=()=>{activeTab='ai';updateTabs();renderSP()};
document.getElementById('libTab').onclick=()=>{activeTab='lib';updateTabs();renderSP()};
function updateTabs(){
  document.getElementById('aiTab').classList.toggle('active',activeTab==='ai');
  document.getElementById('libTab').classList.toggle('active',activeTab==='lib');
}
function renderSP(){
  const body=document.getElementById('spBody'),footer=document.getElementById('spFooter');
  if(activeTab==='ai'){
    footer.textContent='Draw something — AI guesses it!';
    if(aiState==='init'||aiState==='unavailable'){
      body.innerHTML=`<div class="sp-status">${aiState==='unavailable'?'AI model unavailable.<br>Use 🎨 Library tab to browse clipart.':'Initializing AI…'}</div>`;
    }else if(aiState==='loading'){
      body.innerHTML=`<div class="sp-status"><span class="spin"></span><br><br>Loading DoodleNet model…<br><small>(~2MB download)</small></div>`;
    }else if(aiState==='analyzing'){
      body.innerHTML=`<div class="sp-status"><span class="spin"></span><br><br>Analyzing your drawing…</div>`;
    }else if(aiState==='results'&&lastResults.length){
      body.innerHTML=lastResults.map((r,i)=>{
        const pct=Math.round((r.confidence||0)*100);
        const emoji=d2e[r.label]||'❓';
        return `<div class="ai-card" data-i="${i}"><div class="ai-emoji">${emoji}</div><div class="ai-info"><div class="ai-label">${r.label}</div><div class="ai-conf"><div class="ai-conf-bar" style="width:${pct}%"></div></div></div></div>`;
      }).join('');
      body.querySelectorAll('.ai-card').forEach(c=>c.onclick=()=>{
        const r=lastResults[+c.dataset.i];
        const emoji=d2e[r.label];
        if(emoji)applyAISuggestion(emoji);
        else showToast('No emoji for: '+r.label);
      });
      footer.textContent='👆 Click a suggestion to replace your drawing';
    }else{ /* ready */
      body.innerHTML=`<div class="sp-status">✏️ Draw something!<br><br>AI will suggest what it looks like.<br><small>Use brush tool and draw a simple shape.</small></div>`;
    }
  }else{
    footer.textContent='Click an emoji, then click canvas to stamp';
    let html='<div class="cats">';
    Object.keys(clip).forEach(c=>html+=`<button class="cat${c===activeCat?' active':''}" data-cat="${c}">${c}</button>`);
    html+='</div><div class="grid">';
    (clip[activeCat]||[]).forEach(e=>html+=`<div class="ci${selectedStamp===e?' selected':''}" data-e="${e}">${e}</div>`);
    html+='</div>';
    body.innerHTML=html;
    body.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
      activeCat=b.dataset.cat;renderSP();
    });
    body.querySelectorAll('.ci').forEach(c=>c.onclick=()=>{
      selectedStamp=c.dataset.e;
      selectTool('stamp');
      renderSP();
      showToast('Click canvas to stamp '+selectedStamp);
    });
  }
}

// ============ UTILS ============
function hexRgb(h){
  h=h.replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return{r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};
}
let toastT=null;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2000);
}

// ============ KEYBOARD ============
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.ctrlKey||e.metaKey){
    if(e.key==='z'){e.preventDefault();document.getElementById('undoBtn').click()}
    else if(e.key==='y'){e.preventDefault();document.getElementById('redoBtn').click()}
    else if(e.key==='s'){e.preventDefault();document.getElementById('downloadBtn').click()}
  }else{
    const map={b:'brush',e:'eraser',l:'line',r:'rect',c:'circle',f:'fill',s:'stamp'};
    if(map[e.key.toLowerCase()])selectTool(map[e.key.toLowerCase()]);
  }
});

// ============ INIT ============
buildPalette();
resizeCanvas();
saveState();
renderSP();
tryInitAI();
</script>
</body>
